name: SlopLens CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: cd backend && pip install -r requirements.txt && pip install pytest
      - name: Test
        run: pytest tests/ -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check backend/ --ignore E501,E402

  slop-gate:
    name: Slop-gate README
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan README
        run: |
          python3 -c "
          import sys
          FILLERS=['it goes without saying','in today s world','at the end of the day',
            'moving forward','think outside the box','cutting-edge','revolutionize',
            'game-changer','best-in-class','going forward','low-hanging fruit']
          text=open('README.md').read().lower()
          hits=[f for f in FILLERS if f in text]
          if hits:
              print(f'FAIL slop in README: {hits}'); sys.exit(1)
          print('PASS README is clean')
          "
