<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{width:268px;font-family:-apple-system,sans-serif;background:#fff;color:#111;}
  .hdr{padding:16px 16px 12px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:flex-start;}
  .brand{font-size:17px;font-weight:700;letter-spacing:-.3px;}
  .ver{font-family:'Courier New',monospace;font-size:10px;color:#bbb;margin-top:2px;}
  .sub{font-size:12px;color:#888;margin-top:1px;}
  .body{padding:14px 16px;}
  .scan-btn{width:100%;padding:11px;background:#111;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s;}
  .scan-btn:hover:not(:disabled){opacity:.85;}
  .scan-btn:disabled{opacity:.4;cursor:not-allowed;}
  .result{display:none;margin-top:14px;}
  .score-row{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
  .score-num{font-size:40px;font-weight:700;font-family:'Courier New',monospace;line-height:1;}
  .verdict{font-size:12px;color:#555;font-style:italic;line-height:1.45;margin-bottom:6px;}
  .sem-row{font-family:'Courier New',monospace;font-size:10px;color:#bbb;margin-bottom:8px;}
  .settings{padding:12px 16px;border-top:1px solid #f0f0f0;}
  .srow{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .slbl{font-size:12px;color:#555;}
  .toggle{position:relative;display:inline-block;width:36px;height:20px;}
  .toggle input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:#ddd;border-radius:20px;cursor:pointer;transition:.3s;}
  .slider::before{content:"";position:absolute;width:14px;height:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;}
  input:checked+.slider{background:#111;}
  input:checked+.slider::before{transform:translateX(16px);}
  .cfg-lbl{font-size:11px;color:#999;margin-bottom:5px;}
  .cfg-in{width:100%;padding:7px 9px;border:1px solid #e0e0e0;border-radius:6px;font-size:11px;font-family:'Courier New',monospace;color:#333;outline:none;}
  .cfg-in:focus{border-color:#aaa;}
  .footer{padding:10px 16px;border-top:1px solid #f0f0f0;display:flex;justify-content:space-between;}
  .footer span{font-family:'Courier New',monospace;font-size:10px;color:#ccc;}
</style>
</head>
<body>
<div class="hdr">
  <div><div class="brand">SlopLens</div><div class="sub">Slop detector for the web</div></div>
  <div class="ver">v4.0</div>
</div>
<div class="body">
  <button class="scan-btn" id="scanBtn">Scan this page</button>
  <div class="result" id="result">
    <div class="score-row">
      <span class="score-num" id="scoreNum">--</span>
      <span style="font-size:12px;color:#999">/ 100 slop</span>
    </div>
    <p class="verdict" id="verdict"></p>
    <p class="sem-row" id="semRow"></p>
  </div>
</div>
<div class="settings">
  <div class="srow">
    <span class="slbl">Auto-scan on page load</span>
    <label class="toggle"><input type="checkbox" id="autoScan"><span class="slider"></span></label>
  </div>
  <div class="cfg-lbl">Backend URL</div>
  <input class="cfg-in" id="backendIn" type="text" placeholder="https://your-api.railway.app">
</div>
<div class="footer"><span>SLOP SCAN 2026</span><span>UX Track</span></div>
<script src="popup.js"></script>
</body>
</html>
